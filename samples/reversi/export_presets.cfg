[preset.3.options]

; 0 = Testing. The release job runs on Linux with no Apple certificate, so the
; bundle is ad-hoc signed at best. Distribution/App Store want a real identity
; and a provisioning profile, neither of which CI has.
export/distribution_type=0

; universal is the only value that can work. The official macos.zip template
; ships exactly two binaries, godot_macos_release.universal and
; godot_macos_debug.universal, and the exporter looks for
; godot_macos_<release|debug>.<architecture> by literal name with no thinning
; step. Setting x86_64 or arm64 here fails with "Requested template binary
; ... not found" no matter what else is configured.
;
; universal in turn requires the project to import ETC2/ASTC textures. That is a
; project setting, not a preset option, and when it is unset the engine falls
; back to the HOST machine's preferred format: Linux and Windows prefer
; S3TC/BPTC, so the macOS export refuses on any non-Mac runner. The release
; workflow enables it on the runner before the macOS export. Committing
;   [rendering]
;   textures/vram_compression/import_etc2_astc=true
; to project.godot would make that workflow step unnecessary.
binary_format/architecture="universal"

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
application/icon=""
application/icon_interpolation=4

; Required. macOS export fails outright on an empty bundle identifier.
application/bundle_identifier="io.bynine.reversi"

application/signature=""
application/app_category="Board-games"
application/short_version="1.0.0"
application/version="1.0.0"
application/copyright="MIT"
application/min_macos_version_x86_64="11.00"
application/min_macos_version_arm64="13.00"
application/export_angle=0
display/high_res=true
shader_baker/enabled=false

; 1 = Built-in (ad-hoc only). Godot's own signer, so it works from a Linux
; runner. An ad-hoc signed app still needs the quarantine flag cleared on the
; downloader's machine; see the release notes.
codesign/codesign=1
codesign/entitlements/custom_file=""

notarization/notarization=0
ssh_remote_deploy/enabled=false
