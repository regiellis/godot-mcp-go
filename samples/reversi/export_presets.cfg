; Export presets for Reversi (Godot 4.7).
;
; Hand-authored so the CI workflows in .github/workflows/ can export headlessly
; without an editor ever opening this project. Opening the editor's Export
; dialog and saving will rewrite this file and drop these comments.
;
; Every preset excludes two things.
;   media/*            the README screenshots. They already carry a .gdignore,
;                      so Godot skips them anyway; the filter is belt and braces.
;   addons/godot_mcp/* the build-time editor addon. It is gitignored and absent
;                      from the published repo, but a maintainer exporting from
;                      a working checkout has it installed, and without this
;                      line it lands in the shipped pck.

[runnable_presets]

Web="Web"
"Windows Desktop"="Windows Desktop"
Linux="Linux/X11"
macOS="macOS"

[preset.0]

name="Web"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="media/*,addons/godot_mcp/*"
export_path="build/web/game/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false

; DELIBERATE, DO NOT ENABLE. A threaded web build needs SharedArrayBuffer, which
; the browser only hands out to a cross-origin-isolated page. That isolation is
; granted by two response headers:
;
;   Cross-Origin-Opener-Policy: same-origin
;   Cross-Origin-Embedder-Policy: require-corp
;
; GitHub Pages serves static files and cannot set custom response headers, so a
; threaded build does not boot there: it dies at startup before the game runs.
; Turning this on breaks the Pages deploy in .github/workflows/pages.yml.
; The game is single-threaded GDScript drawing in _draw(), so it loses nothing.
variant/thread_support=false

vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""

; 2 = Adaptive: the canvas tracks the browser window, so the 2560x1440 design box
; scales to whatever size the page is. 1 (Project) would pin it to 2560x1440 and
; overflow most screens. Pairs with canvas_items stretch + expand aspect in
; project.godot.
html/canvas_resize_policy=2

html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4

