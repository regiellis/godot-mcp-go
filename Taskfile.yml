version: "3"

# Godot MCP (Go) task runner. Run `task` to list available tasks.
# GODOT selects the Godot binary; override with `task editor GODOT=/path/to/godot`.

vars:
  # Windows needs the .exe suffix; every other platform must not have it.
  BIN: '{{if eq OS "windows"}}bin/godot-mcp.exe{{else}}bin/godot-mcp{{end}}'
  GODOT: godot
  PROJECT: project

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the godot-mcp CLI into bin/
    cmds:
      - go build -o {{.BIN}} ./cmd/godot-mcp

  run:
    desc: "Build and run the CLI, e.g. `task run -- project info`"
    deps: [build]
    cmds:
      - "{{.BIN}} {{.CLI_ARGS}}"

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  tidy:
    desc: Sync go.mod / go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  check:
    desc: fmt + vet + test + param audit
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: audit:params

  audit:params:
    desc: every command's docs declare every param its handler reads (gates the router's -32602 refusal)
    cmds:
      - python3 scripts/lib/audit_params.py

  editor:
    desc: Open the test project in the Godot editor (starts the addon server)
    cmds:
      - "{{.GODOT}} --path {{.PROJECT}} --editor"

  play:
    desc: Run the test project's main scene
    cmds:
      - "{{.GODOT}} --path {{.PROJECT}}"

  godot:version:
    desc: Print the Godot version the GODOT var resolves to
    cmds:
      - "{{.GODOT}} --version"

  slice:
    desc: End-to-end smoke test — calls project.info (editor must be open first)
    deps: [build]
    cmds:
      - "{{.BIN}} project info"

  test:http:
    desc: Conformance sweep of the in-editor streamable-HTTP MCP endpoint (editor must be open first)
    cmds:
      - pwsh -NoProfile -File scripts/test-http-mcp.ps1 {{.CLI_ARGS}}

  eval:
    desc: "Run eval scenario checks against a live project (e.g. task eval -- -Project <dir> -Scenario 00-smoke)"
    cmds:
      - pwsh -NoProfile -File scripts/eval-check.ps1 {{.CLI_ARGS}}

  eval:sandbox:
    desc: "Eval sandbox baseline/verify/cleanup (e.g. task eval:sandbox -- -Project <dir> -Capture)"
    cmds:
      - pwsh -NoProfile -File scripts/eval-sandbox.ps1 {{.CLI_ARGS}}

  dashboard:
    desc: Build and run the live stats dashboard (editor must be open)
    deps: [build]
    cmds:
      - "{{.BIN}} dashboard --project {{.PROJECT}} {{.CLI_ARGS}}"

  release:
    desc: "Build CLI binaries + package addon/skill into dist/ (e.g. task release -- -Version 0.1.0)"
    cmds:
      # Same platform dispatch as `task mirror`: both scripts accept -Version.
      - '{{if eq OS "windows"}}pwsh -NoProfile -File scripts/release.ps1{{else}}scripts/release.sh{{end}} {{.CLI_ARGS}}'

  mirror:
    desc: "Build a filtered mirror snapshot commit (e.g. task mirror -- -Parent <sha> -Message \"...\"); prints the sha, pushes nothing"
    cmds:
      # Windows runs the pwsh original, everything else the POSIX port. Both accept
      # the -Parent/-Message spellings, so one CLI_ARGS passthrough serves both.
      - '{{if eq OS "windows"}}pwsh -NoProfile -File scripts/mirror.ps1{{else}}scripts/mirror.sh{{end}} {{.CLI_ARGS}}'

  mirror:audit:
    desc: Audit what is already public (github/main + asset-library) against the publish policy
    cmds:
      - pwsh -NoProfile -File scripts/mirror-audit.ps1 {{.CLI_ARGS}}

  publish:reversi:
    desc: "Build the godot-reversi snapshot from samples/reversi (e.g. task publish:reversi -- -Parent <sha> -Message \"...\"); prints the sha, pushes nothing"
    cmds:
      - pwsh -NoProfile -File scripts/publish-reversi.ps1 {{.CLI_ARGS}}

  asset:check:
    desc: Does the Asset Library entry need touching? Diffs the addon against the published tip
    cmds:
      - pwsh -NoProfile -File scripts/asset-library.ps1 {{.CLI_ARGS}}
